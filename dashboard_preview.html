<html>
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

<style>
  :root {
    --bg-void: #060b14; --bg-panel: #0d1526; --bg-panel-raised: #131f36; --bg-panel-hover: #182545;
    --line: #1d2a45; --line-soft: #141e34;
    --text-hi: #eaf0fa; --text-mid: #9aa7c2; --text-dim: #5d6b8a;
    --heat-cool: #22d3c7; --heat-warm: #fdba4d; --heat-hot: #fb7a3c; --heat-critical: #e23b3b;
    --font-display: "Space Grotesk", sans-serif; --font-body: "Inter", sans-serif; --font-mono: "JetBrains Mono", monospace;
  }
  * { box-sizing: border-box; }
  html, body, #root { height: 100%; margin: 0; }
  body { background: var(--bg-void); color: var(--text-hi); font-family: var(--font-body); }
  button { font-family: inherit; cursor: pointer; }
  .app-shell { display: grid; grid-template-columns: 320px 1fr; height: 100vh; width: 100%; overflow: hidden; }
  .sidebar { background: var(--bg-panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; overflow-y: auto; }
  .sidebar-header { padding: 22px 20px 16px; border-bottom: 1px solid var(--line-soft); }
  .eyebrow { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--heat-warm); display: flex; align-items: center; gap: 8px; margin-bottom: 9px; }
  .eyebrow-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--heat-critical); box-shadow: 0 0 0 3px rgba(226,59,59,.2); animation: pulse 2.2s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { box-shadow: 0 0 0 3px rgba(226,59,59,.2);} 50% { box-shadow: 0 0 0 6px rgba(226,59,59,.05);} }
  .app-title { font-family: var(--font-display); font-weight: 600; font-size: 19px; margin: 0 0 6px; }
  .app-subtitle { font-size: 12.5px; color: var(--text-mid); line-height: 1.5; margin: 0; }
  .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; padding: 16px 20px; border-bottom: 1px solid var(--line-soft); }
  .stat-card { background: var(--bg-panel-raised); border: 1px solid var(--line); border-radius: 10px; padding: 11px 12px; }
  .stat-card-value { font-family: var(--font-mono); font-size: 20px; font-weight: 600; line-height: 1; }
  .stat-card-value.critical { color: var(--heat-critical); }
  .stat-card-value.warm { color: var(--heat-warm); }
  .stat-card-label { font-size: 10.5px; color: var(--text-dim); margin-top: 6px; text-transform: uppercase; letter-spacing: .05em; }
  .legend-block { padding: 16px 20px; border-bottom: 1px solid var(--line-soft); }
  .legend-title { font-size: 11.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--text-mid); margin: 0 0 11px; }
  .thermal-scale { position: relative; height: 9px; border-radius: 999px; background: linear-gradient(90deg, var(--heat-cool) 0%, var(--heat-warm) 45%, var(--heat-hot) 72%, var(--heat-critical) 100%); overflow: hidden; }
  .thermal-scale::after { content: ""; position: absolute; top: 0; left: -30%; width: 30%; height: 100%; background: linear-gradient(90deg, transparent, rgba(255,255,255,.5), transparent); animation: scan 3.4s linear infinite; }
  @keyframes scan { 0% { left: -30%; } 100% { left: 100%; } }
  .thermal-scale-labels { display: flex; justify-content: space-between; font-family: var(--font-mono); font-size: 10px; color: var(--text-dim); margin-top: 7px; }
  .filter-block { padding: 16px 20px; border-bottom: 1px solid var(--line-soft); flex-grow: 1; }
  .filter-row { display: flex; flex-direction: column; gap: 8px; }
  .filter-chip { display: flex; align-items: center; justify-content: space-between; padding: 9px 11px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg-panel-raised); color: var(--text-mid); font-size: 12.5px; }
  .filter-chip.active { border-color: var(--heat-warm); background: var(--bg-panel-hover); color: var(--text-hi); }
  .filter-chip-swatch { width: 9px; height: 9px; border-radius: 3px; flex-shrink: 0; margin-right: 9px; }
  .filter-chip-inner { display: flex; align-items: center; }
  .filter-chip-count { font-family: var(--font-mono); color: var(--text-dim); }
  .sidebar-footer { padding: 14px 20px 20px; font-size: 11px; color: var(--text-dim); line-height: 1.6; }
  .map-area { position: relative; }
  #leaflet-map { width: 100%; height: 100%; background: var(--bg-void); }
  .map-topbar { position: absolute; top: 16px; left: 16px; z-index: 500; background: rgba(13,21,38,.88); border: 1px solid var(--line); border-radius: 10px; padding: 8px 13px; font-family: var(--font-mono); font-size: 11px; color: var(--text-mid); }
  .map-topbar strong { color: var(--text-hi); }
  .detail-panel { position: absolute; top: 0; right: 0; height: 100%; width: 320px; max-width: 85%; background: var(--bg-panel); border-left: 1px solid var(--line); z-index: 600; padding: 20px; overflow-y: auto; animation: slidein .25s ease; }
  @keyframes slidein { from { transform: translateX(20px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
  .detail-panel-close { background: none; border: 1px solid var(--line); color: var(--text-mid); border-radius: 6px; width: 26px; height: 26px; display: flex; align-items: center; justify-content: center; margin-bottom: 16px; }
  .detail-tag { display: inline-flex; font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; padding: 4px 9px; border-radius: 999px; border: 1px solid; margin-bottom: 12px; }
  .detail-area-id { font-family: var(--font-mono); font-size: 12px; color: var(--text-dim); margin-bottom: 4px; }
  .detail-headline { font-family: var(--font-display); font-size: 23px; font-weight: 600; margin: 0 0 16px; }
  .detail-metric { border-top: 1px solid var(--line-soft); padding: 12px 0; }
  .detail-metric-row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 7px; }
  .detail-metric-label { font-size: 12px; color: var(--text-mid); }
  .detail-metric-value { font-family: var(--font-mono); font-size: 14px; }
  .detail-bar-track { height: 5px; border-radius: 999px; background: var(--bg-panel-raised); overflow: hidden; }
  .detail-bar-fill { height: 100%; border-radius: 999px; }
  .detail-explain { margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--line-soft); }
  .detail-explain-title { font-size: 11.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--text-mid); margin-bottom: 9px; }
  .detail-explain-text { font-size: 13px; line-height: 1.6; color: var(--text-mid); }
  .detail-empty { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; color: var(--text-dim); padding: 30px; }
  .detail-empty-icon { width: 38px; height: 38px; border-radius: 50%; border: 1.5px dashed var(--line); margin-bottom: 14px; display: flex; align-items: center; justify-content: center; font-family: var(--font-mono); color: var(--text-dim); }
  .detail-empty-text { font-size: 12.5px; line-height: 1.6; max-width: 200px; }
  .leaflet-popup-content-wrapper { background: #0d1526; color: #eaf0fa; border: 1px solid #1d2a45; }
  .leaflet-popup-tip { background: #0d1526; }
</style>

<script type="text/babel">
const { useState, useEffect, useMemo, useRef } = React;

const RISK_BANDS = [
  { key: "critical", label: "Critical", min: 0.72, max: 1.01, color: "rgb(226, 59, 59)" },
  { key: "elevated", label: "Elevated", min: 0.45, max: 0.72, color: "rgb(251, 122, 60)" },
  { key: "low", label: "Low", min: 0, max: 0.45, color: "rgb(34, 211, 199)" },
];

const STOPS = [
  { at: 0.0, color: [34, 211, 199] },
  { at: 0.45, color: [253, 186, 77] },
  { at: 0.72, color: [251, 122, 60] },
  { at: 1.0, color: [226, 59, 59] },
];

function lerp(a, b, t) { return a + (b - a) * t; }

function riskToColor(prob) {
  const p = Math.min(Math.max(prob ?? 0, 0), 1);
  for (let i = 0; i < STOPS.length - 1; i++) {
    const a = STOPS[i], b = STOPS[i + 1];
    if (p >= a.at && p <= b.at) {
      const t = (p - a.at) / (b.at - a.at || 1);
      return `rgb(${Math.round(lerp(a.color[0], b.color[0], t))}, ${Math.round(lerp(a.color[1], b.color[1], t))}, ${Math.round(lerp(a.color[2], b.color[2], t))})`;
    }
  }
  return `rgb(${STOPS[STOPS.length - 1].color.join(", ")})`;
}

function riskToLabel(prob) {
  if (prob >= 0.72) return "Critical";
  if (prob >= 0.45) return "Elevated";
  return "Low";
}

const FEATURE_IMPORTANCE = { temp_f: 0.708, svi_score: 0.292 };

function explainArea(point) {
  const hotter = point.temp_f >= 97.6;
  const vulnerable = point.svi_score >= 0.55;
  if (hotter && vulnerable) return "Flagged because this area combines above-average heat with high social vulnerability — the two factors compound rather than offset.";
  if (hotter) return `Driven mainly by temperature (${(FEATURE_IMPORTANCE.temp_f * 100).toFixed(0)}% of the model's weight) — this tile runs hotter than most of the grid.`;
  if (vulnerable) return `Driven mainly by social vulnerability (${(FEATURE_IMPORTANCE.svi_score * 100).toFixed(0)}% of the model's weight) — temperature is near average, but coping capacity is low.`;
  return "Both temperature and social vulnerability sit near the grid average, keeping this area's score low.";
}

function Sidebar({ points, activeBand, onBandChange }) {
  const total = points.length;
  const critical = points.filter(p => p.predicted_risk_prob >= 0.72).length;
  const elevated = points.filter(p => p.predicted_risk_prob >= 0.45 && p.predicted_risk_prob < 0.72).length;
  const avgTemp = total > 0 ? (points.reduce((s, p) => s + (p.temp_f ?? 0), 0) / total).toFixed(1) : "—";
  const bandCounts = { critical, elevated, low: total - critical - elevated };

  return (
    <aside className="sidebar">
      <div className="sidebar-header">
        <div className="eyebrow"><span className="eyebrow-dot"></span>Live model output</div>
        <h1 className="app-title">Heat-Health Risk Predictor</h1>
        <p className="app-subtitle">Hyperlocal temperature × social vulnerability, scored per area.</p>
      </div>
      <div className="stat-grid">
        <div className="stat-card"><div className="stat-card-value">{total || "—"}</div><div className="stat-card-label">Areas scored</div></div>
        <div className="stat-card"><div className="stat-card-value critical">{critical || "—"}</div><div className="stat-card-label">Critical risk</div></div>
        <div className="stat-card"><div className="stat-card-value warm">{elevated || "—"}</div><div className="stat-card-label">Elevated risk</div></div>
        <div className="stat-card"><div className="stat-card-value">{avgTemp}°F</div><div className="stat-card-label">Avg. temperature</div></div>
      </div>
      <div className="legend-block">
        <p className="legend-title">Risk scale</p>
        <div className="thermal-scale"></div>
        <div className="thermal-scale-labels"><span>Low</span><span>Elevated</span><span>Critical</span></div>
      </div>
      <div className="filter-block">
        <p className="legend-title">Filter by risk band</p>
        <div className="filter-row">
          <button className={`filter-chip ${activeBand === null ? "active" : ""}`} onClick={() => onBandChange(null)}>
            <span className="filter-chip-inner"><span className="filter-chip-swatch" style={{background: "var(--text-dim)"}}></span>All areas</span>
            <span className="filter-chip-count">{total}</span>
          </button>
          {RISK_BANDS.map(band => (
            <button key={band.key} className={`filter-chip ${activeBand === band.key ? "active" : ""}`} onClick={() => onBandChange(band.key)}>
              <span className="filter-chip-inner"><span className="filter-chip-swatch" style={{background: band.color}}></span>{band.label}</span>
              <span className="filter-chip-count">{bandCounts[band.key]}</span>
            </button>
          ))}
        </div>
      </div>
      <div className="sidebar-footer">Rendered directly from the <code>output</code> variable in this notebook.</div>
    </aside>
  );
}

function AreaDetailPanel({ point, onClose }) {
  if (!point) {
    return (
      <div className="detail-panel">
        <div className="detail-empty">
          <div className="detail-empty-icon">◎</div>
          <p className="detail-empty-text">Click any point on the map to see its risk breakdown.</p>
        </div>
      </div>
    );
  }
  const color = riskToColor(point.predicted_risk_prob);
  const label = riskToLabel(point.predicted_risk_prob);
  const probPct = Math.round(point.predicted_risk_prob * 100);
  return (
    <div className="detail-panel" key={point.area_id}>
      <button className="detail-panel-close" onClick={onClose}>✕</button>
      <span className="detail-tag" style={{color, borderColor: color}}>{label} risk</span>
      <div className="detail-area-id">{point.area_id}</div>
      <h2 className="detail-headline">{probPct}% predicted risk</h2>
      <div className="detail-metric">
        <div className="detail-metric-row"><span className="detail-metric-label">Temperature</span><span className="detail-metric-value">{point.temp_f?.toFixed(1)}°F</span></div>
        <div className="detail-bar-track"><div className="detail-bar-fill" style={{width: `${Math.min(((point.temp_f - 95) / 5) * 100, 100)}%`, background: "var(--heat-hot)"}}></div></div>
      </div>
      <div className="detail-metric">
        <div className="detail-metric-row"><span className="detail-metric-label">Social vulnerability</span><span className="detail-metric-value">{point.svi_score?.toFixed(2)}</span></div>
        <div className="detail-bar-track"><div className="detail-bar-fill" style={{width: `${(point.svi_score ?? 0) * 100}%`, background: "var(--heat-cool)"}}></div></div>
      </div>
      <div className="detail-metric">
        <div className="detail-metric-row"><span className="detail-metric-label">Coordinates</span><span className="detail-metric-value">{point.lat?.toFixed(4)}, {point.lon?.toFixed(4)}</span></div>
      </div>
      <div className="detail-explain">
        <p className="detail-explain-title">Why this area was flagged</p>
        <p className="detail-explain-text">{explainArea(point)}</p>
      </div>
    </div>
  );
}

function App() {
  const points = useMemo(() => {
    const raw = JSON.parse(document.getElementById("risk-data").textContent);
    return Array.isArray(raw) ? raw : (raw.output ?? []);
  }, []);

  const [activeBand, setActiveBand] = useState(null);
  const [selectedId, setSelectedId] = useState(null);
  const mapRef = useRef(null);
  const leafletMapInstance = useRef(null);
  const markersRef = useRef([]);

  const filteredPoints = useMemo(() => {
    if (!activeBand) return points;
    const band = RISK_BANDS.find(b => b.key === activeBand);
    if (!band) return points;
    return points.filter(p => p.predicted_risk_prob >= band.min && p.predicted_risk_prob < band.max);
  }, [points, activeBand]);

  const selectedPoint = points.find(p => p.area_id === selectedId) ?? null;

  useEffect(() => {
    if (!mapRef.current || leafletMapInstance.current) return;
    const map = L.map(mapRef.current, { zoomControl: false, attributionControl: false });
    L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png", {
      attribution: "© CARTO © OpenStreetMap"
    }).addTo(map);
    leafletMapInstance.current = map;
    if (points.length) {
      map.fitBounds(points.map(p => [p.lat, p.lon]), { padding: [40, 40], maxZoom: 15 });
    } else {
      map.setView([34.05, -118.24], 12);
    }
  }, []);

  useEffect(() => {
    const map = leafletMapInstance.current;
    if (!map) return;
    markersRef.current.forEach(m => map.removeLayer(m));
    markersRef.current = filteredPoints.map(p => {
      const color = riskToColor(p.predicted_risk_prob);
      const isSelected = selectedId === p.area_id;
      const marker = L.circleMarker([p.lat, p.lon], {
        radius: isSelected ? 10 : 6,
        color: isSelected ? "#eaf0fa" : color,
        weight: isSelected ? 2 : 1,
        fillColor: color,
        fillOpacity: isSelected ? 0.95 : 0.75,
      }).addTo(map);
      marker.bindTooltip(`${p.area_id} · ${p.temp_f?.toFixed(1)}°F · ${(p.predicted_risk_prob * 100).toFixed(0)}% risk`);
      marker.on("click", () => setSelectedId(p.area_id));
      return marker;
    });
  }, [filteredPoints, selectedId]);

  return (
    <div className="app-shell">
      <Sidebar points={points} activeBand={activeBand} onBandChange={(b) => { setActiveBand(b); setSelectedId(null); }} />
      <div className="map-area">
        <div className="map-topbar">Showing <strong>{filteredPoints.length}</strong> of <strong>{points.length}</strong> areas</div>
        <div id="leaflet-map" ref={mapRef}></div>
        <AreaDetailPanel point={selectedPoint} onClose={() => setSelectedId(null)} />
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
